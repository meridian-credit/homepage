name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.21.1
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      # 운영 서버에서 도는 의존성은 moderate 부터 막고, 개발 도구는 critical 만 막는다.
      # 2026-10-12: braces(<=3.0.3, 고친 판이 아직 없음)가 eslint-config-next → fast-glob → micromatch 로만 들어와
      # high 로 걸린다. 우리 eslint 설정의 glob 만 처리해 바깥 입력이 닿지 않는다. 고친 판이 나오면 한 줄로 되돌린다.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (critical only)
        run: npm audit --audit-level=critical

      - name: Verify package signatures
        run: npm audit signatures

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx --json > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  verify:
    needs: supply-chain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.21.1
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild trusted native packages
        run: npm rebuild sharp unrs-resolver

      - name: Audit content metadata
        run: npm run audit:content

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser acceptance tests with production CSP
        env:
          QA_BASE_URL: https://localhost:3443
        run: |
          node scripts/qa/https.mjs > /tmp/homepage-https.log 2>&1 &
          npm run test:e2e -- --workers=2

      # 관리자 앱(admin/). 공개 시험보다 뒤에 둔다 — 이 시험은 저장을 반영하면서 공개 빌드(.next)의 FAQ · 일정 쪽을 새로 그려 둔다.
      - name: Admin app tests
        run: |
          npx next build admin
          npx playwright test -c admin/playwright.config.ts

      - name: Upload browser failures and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
            admin/.e2e/results/
          retention-days: 14
